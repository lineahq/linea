# The example plugin behind several fleet replicas. Use after compose.yaml,
# compose.ha.yaml and this example's compose.yaml, from the repository root:
#
#   docker compose -f deploy/compose/fleet/compose.yaml -f deploy/compose/fleet/compose.ha.yaml \
#     -f examples/fleet-agent-summary-plugin/compose.yaml -f examples/fleet-agent-summary-plugin/compose.ha.yaml \
#     up -d --wait fleet lb agent-summary-plugin
#
# Every replica probes the plugin directly. The plugin reaches the host
# listener through the load balancer, so its session poll survives the loss
# of any one replica.
services:
  lb:
    networks: [ingress, plugins]

  agent-summary-plugin:
    command: [-listen, "0.0.0.0:8090", -host-endpoint, "http://lb:8081", -allow-insecure-host,
              -host-token-file, /run/secrets/summary_host_token, -service-token-file, /run/secrets/summary_service_token]
    depends_on: [lb]
