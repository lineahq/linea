# Supervisor for scripts/fleet/smoke-supervisor.sh. The token comes from the
# environment; remote config is merged over the local file.
server:
  endpoint: ws://fleet:4320/v1/opamp
  headers:
    Authorization: "Bearer ${env:LINEA_FLEET_AGENT_TOKEN}"
capabilities:
  accepts_remote_config: true
  reports_effective_config: true
  reports_health: true
  reports_heartbeat: true
  reports_available_components: true
  accepts_restart_command: false
  accepts_opamp_connection_settings: false
agent:
  executable: /otelcol-contrib
  config_files: [/etc/otelcol/local.yaml]
  validate_config: true
  automatic_config_rollback: true
  config_apply_timeout: 10s
storage:
  directory: /home/opampsupervisor/storage
