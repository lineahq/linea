# The fan-out gate's load balancer (scripts/debugger/fanout-compose.yaml).
global
  log stdout format raw local0 notice
  maxconn 1024

# Docker's embedded DNS answers linea with every replica's address.
resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold other 2s
  hold nx 2s
  hold timeout 2s
  hold refused 2s
  hold obsolete 2s

defaults
  mode http
  log global
  option dontlognull
  option dontlog-normal
  option redispatch
  retries 3
  timeout connect 5s
  timeout client 10m
  timeout server 10m
  timeout http-request 30s
  timeout http-keep-alive 60s
  # Workers hold a WebSocket to the server for as long as they run.
  timeout tunnel 1h

frontend in
  bind :7070
  default_backend linea

# An instance that drains answers /readyz with 503 and leaves the
# rotation within a second or two; the server hands its runs back.
backend linea
  balance roundrobin
  option httpchk
  http-check send meth GET uri /readyz
  http-check expect status 200
  default-server check inter 500ms fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr none
  server-template linea 2 linea:7070
