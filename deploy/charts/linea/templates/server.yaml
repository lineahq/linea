{{- $fullname := include "linea.fullname" . -}}
{{- $tls := .Values.server.tls.secretName -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # Instances share the run queue, events and sign-ins through PostgreSQL: a
  # rollout replaces them one at a time.
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "linea.serverSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linea.serverSelector" . | nindent 8 }}
      annotations:
        # The server config is read at startup; a change restarts the server.
        checksum/config: {{ include "linea.serverConfig" . | sha256sum }}
        {{- if and (include "linea.adminEnabled" .) (not .Values.admin.existingSecret) }}
        # The admin password is read at startup too.
        checksum/admin: {{ include "linea.adminPassword" . | sha256sum }}
        {{- end }}
        {{- if not .Values.store.existingSecret }}
        # So are the store credentials, the bundled PostgreSQL's password included.
        checksum/store: {{ printf "%s/%s/%s/%s" .Values.store.databaseURL (include "linea.objects" . | fromYaml).accessKey (include "linea.objects" . | fromYaml).secretKey (ternary (include "linea.postgresqlPassword" .) "" .Values.postgresql.enabled) | sha256sum }}
        {{- end }}
        {{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
        checksum/oidc: {{ .Values.oidc.clientSecret | sha256sum }}
        {{- end }}
        {{- if include "linea.workerTokenRendered" . }}
        # And the tokens it checks workers and builders against.
        checksum/worker-token: {{ include "linea.workerToken" . | sha256sum }}
        {{- end }}
        {{- if include "linea.builderTokenRendered" . }}
        checksum/builder-token: {{ include "linea.builderToken" . | sha256sum }}
        {{- end }}
        {{- if include "linea.fleetDeployed" . }}
        checksum/fleet: {{ include "linea.fleetOperatorToken" . | sha256sum }}
        {{- else if and .Values.fleet.url (not .Values.fleet.existingSecret) }}
        checksum/fleet: {{ .Values.fleet.token | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      # The drain, handing unfinished runs back and the HTTP shutdown.
      terminationGracePeriodSeconds: {{ add .Values.server.drainSeconds 20 }}
      {{- with .Values.server.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/linea/config/config.yaml
            - --addr=0.0.0.0:7070
            - --drain-timeout={{ .Values.server.drainSeconds }}s
            {{- if $tls }}
            - --tls-cert-file=/etc/linea/tls/tls.crt
            - --tls-key-file=/etc/linea/tls/tls.key
            {{- else }}
            # TLS ends at the ingress in front of the server.
            - --allow-http
            {{- end }}
            {{- if .Values.server.mcp }}
            - --mcp
            {{- end }}
            {{- if include "linea.hasFleet" . }}
            - --fleet-url={{ include "linea.fleetURL" . }}
            - --fleet-token-file=/etc/linea/fleet/token
            {{- if include "linea.fleetAllowHTTP" . }}
            - --fleet-allow-http
            {{- end }}
            {{- end }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Nothing is kept in a home directory; point it at scratch space.
            - name: HOME
              value: /tmp
            {{- if .Values.server.caSecret }}
            # Go reads every file in SSL_CERT_DIR besides its default bundle,
            # so the private CA adds to the system roots.
            - name: SSL_CERT_DIR
              value: /etc/linea/ca
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7070
          # /healthz answers while the process serves; /readyz also answers
          # 503 while the instance drains, so the Service stops sending it
          # requests. Neither needs a credential. The kubelet does not verify
          # the certificate when the server serves TLS.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ if $tls }}HTTPS{{ else }}HTTP{{ end }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ if $tls }}HTTPS{{ else }}HTTP{{ end }}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/linea/config
              readOnly: true
            - name: store
              mountPath: /etc/linea/store
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $tls }}
            - name: tls
              mountPath: /etc/linea/tls
              readOnly: true
            {{- end }}
            {{- if .Values.server.caSecret }}
            - name: ca
              mountPath: /etc/linea/ca
              readOnly: true
            {{- end }}
            {{- if include "linea.hasFleet" . }}
            - name: fleet
              mountPath: /etc/linea/fleet
              readOnly: true
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: postgresql
              mountPath: /etc/linea/postgresql
              readOnly: true
            {{- end }}
            {{- if include "linea.adminEnabled" . }}
            - name: admin
              mountPath: /etc/linea/admin
              readOnly: true
            {{- end }}
            {{- if include "linea.hasOIDCSecret" . }}
            - name: oidc
              mountPath: /etc/linea/oidc
              readOnly: true
            {{- end }}
            {{- if include "linea.acceptsWorkers" . }}
            - name: worker-token
              mountPath: /etc/linea/worker-token
              readOnly: true
            {{- end }}
            {{- if include "linea.acceptsBuilds" . }}
            - name: builder-token
              mountPath: /etc/linea/builder-token
              readOnly: true
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: store
          secret:
            secretName: {{ include "linea.storeSecret" . }}
            items:
              {{- if not .Values.postgresql.enabled }}
              - {key: database-url, path: database-url}
              {{- end }}
              - {key: access-key, path: access-key}
              - {key: secret-key, path: secret-key}
        {{- if .Values.postgresql.enabled }}
        # The bundled PostgreSQL's password, completing store.database_url.
        - name: postgresql
          secret:
            secretName: {{ include "linea.postgresqlName" . }}
            items: [{key: password, path: password}]
        {{- end }}
        {{- if include "linea.adminEnabled" . }}
        - name: admin
          secret:
            secretName: {{ include "linea.adminSecret" . }}
            items: [{key: password, path: password}]
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ $tls }}
        {{- end }}
        {{- if .Values.server.caSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.server.caSecret }}
            items: [{key: {{ .Values.server.caKey | quote }}, path: ca.crt}]
        {{- end }}
        {{- if include "linea.hasFleet" . }}
        - name: fleet
          secret:
            secretName: {{ include "linea.fleetSecret" . }}
            {{- /* The release's own fleet gives the server its operator token; the admin token in the same Secret is not mounted. */}}
            items: [{key: {{ ternary "operator-token" "token" (eq (include "linea.fleetDeployed" .) "true") }}, path: token}]
        {{- end }}
        {{- if include "linea.hasOIDCSecret" . }}
        - name: oidc
          secret:
            secretName: {{ include "linea.oidcSecret" . }}
            items: [{key: client-secret, path: client-secret}]
        {{- end }}
        {{- if include "linea.acceptsWorkers" . }}
        - name: worker-token
          secret:
            secretName: {{ include "linea.workerSecret" . }}
            items: [{key: token, path: token}]
        {{- end }}
        {{- if include "linea.acceptsBuilds" . }}
        - name: builder-token
          secret:
            secretName: {{ include "linea.builderSecret" . }}
            items: [{key: token, path: token}]
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "linea.serverSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
