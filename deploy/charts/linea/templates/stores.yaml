{{- /*
The bundled stores (postgresql.enabled, seaweedfs.enabled): one pod each
with a PersistentVolumeClaim, for evaluation and small teams. No
replication and no backups; production uses your own PostgreSQL and bucket
(store).
*/}}
{{- if .Values.postgresql.enabled }}
{{- $name := include "linea.postgresqlName" . }}
{{- $p := .Values.postgresql }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "linea.postgresqlPassword" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    {{- include "linea.postgresqlSelector" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "linea.postgresqlSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linea.postgresqlSelector" . | nindent 8 }}
      annotations:
        checksum/password: {{ include "linea.postgresqlPassword" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's postgres user. The data lives in a subdirectory: the
      # volume's root may hold lost+found.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ include "linea.image" $p.image | quote }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          env:
            - {name: POSTGRES_DB, value: linea}
            - {name: POSTGRES_USER, value: linea}
            - {name: POSTGRES_PASSWORD_FILE, value: /etc/postgresql-secret/password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, linea, -d, linea]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, linea, -d, linea]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: password, mountPath: /etc/postgresql-secret, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: password
          secret:
            secretName: {{ $name }}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $p.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.persistence.size }}
{{- if .Values.networkPolicy.enabled }}
---
# Only the server reaches PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "linea.postgresqlSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "linea.serverSelector" . | nindent 14 }}
      ports:
        - port: postgresql
{{- end }}
---
{{- end }}
{{- if .Values.seaweedfs.enabled }}
{{- $name := include "linea.seaweedfsName" . }}
{{- $w := .Values.seaweedfs }}
{{- $bucket := printf "%s-bucket" $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ include "linea.seaweedfsAccessKey" . | quote }}
  secret-key: {{ include "linea.seaweedfsSecretKey" . | quote }}
  s3.json: {{ dict "identities" (list (dict "name" "linea" "credentials" (list (dict "accessKey" (include "linea.seaweedfsAccessKey" .) "secretKey" (include "linea.seaweedfsSecretKey" .))) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  selector:
    {{- include "linea.seaweedfsSelector" . | nindent 4 }}
  ports:
    # The S3 gateway the server, the pool and builders use.
    - {name: s3, port: 8333, targetPort: s3}
    # The master (HTTP and gRPC), for the bucket Job's weed shell, which
    # then reaches the filer at the pod's address.
    - {name: master, port: 9333, targetPort: master}
    - {name: master-grpc, port: 19333, targetPort: master-grpc}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "linea.seaweedfsSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linea.seaweedfsSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s/%s" (include "linea.seaweedfsAccessKey" .) (include "linea.seaweedfsSecretKey" .) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ include "linea.image" $w.image | quote }}
          imagePullPolicy: {{ $w.image.pullPolicy }}
          command: [weed]
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            # Advertised to the bucket Job's weed shell.
            - -ip=$(POD_IP)
            - -master.volumeSizeLimitMB={{ $w.volumeSizeLimitMB }}
            # As many volumes as the disk holds.
            - -volume.max=0
            - -filer
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          workingDir: /data
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          ports:
            - {name: s3, containerPort: 8333}
            - {name: master, containerPort: 9333}
            - {name: master-grpc, containerPort: 19333}
            - {name: filer, containerPort: 8888}
            - {name: filer-grpc, containerPort: 18888}
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}
            items: [{key: s3.json, path: s3.json}]
        - {name: tmp, emptyDir: {}}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $w.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $w.persistence.size }}
---
# Creates the bucket once the store answers and keeps an existing one. One
# Job per release revision, removed a while after it finishes.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%d" $bucket .Release.Revision }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs-bucket
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: seaweedfs-bucket
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bucket
          image: {{ include "linea.image" $w.image | quote }}
          imagePullPolicy: {{ $w.image.pullPolicy }}
          command: [sh, -c]
          args:
            - |
              for i in $(seq 120); do
                if echo 's3.bucket.list' | weed shell -master={{ $name }}:9333 2>/dev/null | grep -qw {{ $w.bucket | quote }}; then exit 0; fi
                echo 's3.bucket.create -name {{ $w.bucket }}' | weed shell -master={{ $name }}:9333 >/dev/null 2>&1
                sleep 2
              done
              echo 'the bucket {{ $w.bucket }} could not be created' >&2
              exit 1
          workingDir: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- if .Values.networkPolicy.enabled }}
---
# The S3 gateway admits the server, the pool, workers and builders; the
# master and filer admit only the bucket Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "linea.seaweedfsSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $c := list "server" "pool" "worker" "builder" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $c }}
        {{- end }}
      ports:
        - port: s3
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: seaweedfs-bucket
      ports:
        - port: master
        - port: master-grpc
        - port: filer
        - port: filer-grpc
    # The pod reaches its own master and filer through the Service.
    - from:
        - podSelector:
            matchLabels:
              {{- include "linea.seaweedfsSelector" . | nindent 14 }}
{{- end }}
{{- end }}
