{{- $fullname := include "linea.fullname" . -}}
{{- if and .Values.fleet.url (not .Values.fleet.existingSecret) }}
{{- if not .Values.fleet.token }}
{{- fail "fleet.url needs fleet.token or fleet.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-fleet
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.fleet.token | quote }}
---
{{- end }}
{{- if not .Values.store.existingSecret }}
{{- include "linea.checkBundledStores" . }}
{{- $databaseURL := include "linea.databaseURL" . }}
{{- $o := include "linea.objects" . | fromYaml }}
{{- if not (and $databaseURL $o.accessKey $o.secretKey) }}
{{- fail "store needs databaseURL, objects.accessKey and objects.secretKey, or store.existingSecret, or the bundled postgresql and seaweedfs" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-store
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $databaseURL | quote }}
  access-key: {{ $o.accessKey | quote }}
  secret-key: {{ $o.secretKey | quote }}
---
{{- end }}
{{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-oidc
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
---
{{- end }}
{{- if and (include "linea.acceptsWorkers" .) (not .Values.worker.existingSecret) }}
{{- $name := printf "%s-worker-token" $fullname }}
{{- $token := .Values.worker.token }}
{{- if not $token }}
{{- /* Keep the generated token across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data $existing.data.token }}
{{- $token = b64dec $existing.data.token }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
{{- if and (include "linea.acceptsBuilds" .) (not .Values.builder.existingSecret) }}
---
{{- $name := printf "%s-builder-token" $fullname }}
{{- $token := .Values.builder.token }}
{{- if not $token }}
{{- /* Keep the generated token across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data $existing.data.token }}
{{- $token = b64dec $existing.data.token }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
