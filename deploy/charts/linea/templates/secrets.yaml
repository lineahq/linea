{{- $fullname := include "linea.fullname" . -}}
{{- if and .Values.fleet.url (not .Values.fleet.existingSecret) }}
{{- if not .Values.fleet.token }}
{{- fail "fleet.url needs fleet.token or fleet.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-fleet
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.fleet.token | quote }}
---
{{- end }}
{{- if not .Values.store.existingSecret }}
{{- include "linea.checkBundledStores" . }}
{{- $databaseURL := .Values.store.databaseURL }}
{{- $o := include "linea.objects" . | fromYaml }}
{{- if not (and (or $databaseURL .Values.postgresql.enabled) $o.accessKey $o.secretKey) }}
{{- fail "store needs databaseURL, objects.accessKey and objects.secretKey, or store.existingSecret, or the bundled postgresql and seaweedfs" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-store
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* The bundled PostgreSQL's password is read from its own Secret. */}}
  {{- if not .Values.postgresql.enabled }}
  database-url: {{ $databaseURL | quote }}
  {{- end }}
  access-key: {{ $o.accessKey | quote }}
  secret-key: {{ $o.secretKey | quote }}
---
{{- end }}
{{- if and (include "linea.adminEnabled" .) (not .Values.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linea.adminSecret" . }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "linea.adminPassword" . | quote }}
---
{{- end }}
{{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-oidc
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
---
{{- end }}
{{- if include "linea.workerTokenRendered" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-worker-token" $fullname }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* A generated token is kept across upgrades (keptSecret). */}}
  token: {{ include "linea.workerToken" . | quote }}
{{- end }}
{{- if include "linea.builderTokenRendered" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-builder-token" $fullname }}
  labels:
    {{- include "linea.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ include "linea.builderToken" . | quote }}
{{- end }}
