# The debugger's server on one machine: linea-server, PostgreSQL, SeaweedFS
# for payloads, a pool worker that runs the built-in runtime and every
# runtime the server builds, and a runtime builder. See
# docs/debugger/deploy-compose.md.
#
# Put this file in a directory with a secrets/ directory, one file per
# secret listed at the end, and an optional .env with settings (start from
# .env.example), and run docker compose up -d there. One person on 127.0.0.1
# and a team behind an identity provider use this same file and differ only
# in .env. Edit .env and run docker compose up -d again to apply a change;
# after changing a secret file, run docker compose restart.
#
# The port serves plain HTTP on 127.0.0.1:7070. To reach it from elsewhere,
# put the reverse proxy that serves your HTTPS in front of it and set
# LINEA_BIND (docs/debugger/deploy-compose.md has a Caddy example).
#
# Needs Docker Engine 25 or later with Compose v2.24 or later.
name: linea

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: linea
      POSTGRES_USER: linea
      # Taken once, when the volume is created.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, linea, -d, linea]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # The S3 credentials sign in its admin identity, which SeaweedFS takes
  # only from its environment; the server creates the bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    entrypoint: [sh, -c, 'AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)" exec weed "$$@"', weed]
    command: [server, -dir=/data, -master.volumeSizeLimitMB=64, -volume.max=30, -filer, -s3, -s3.port=8333]
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - seaweedfs-data:/data
    networks: [storage]
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # The server, configured from the environment (docs/debugger/team-server.md
  # lists every variable). It migrates its database and creates its bucket at
  # start, and drains on stop (--drain-timeout), handing back what it still
  # runs; stop_grace_period leaves room for that.
  linea:
    <<: *hardened
    image: ghcr.io/lineahq/linea-server:${LINEA_VERSION:-0.2.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-server.Dockerfile
    user: "65532:65532"
    command: [--addr, "0.0.0.0:7070", --allow-http, --mcp, --drain-timeout, 25s]
    stop_grace_period: 45s
    environment:
      # Storage and the workers' and builder's tokens: fixed by this file.
      LINEA_STORE_DATABASE_URL: postgres://linea@postgres:5432/linea?sslmode=disable
      LINEA_STORE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      LINEA_STORE_OBJECTS_ENDPOINT: http://seaweedfs:8333
      LINEA_STORE_OBJECTS_BUCKET: linea
      LINEA_STORE_OBJECTS_PATH_STYLE: "true"
      LINEA_STORE_OBJECTS_CREATE_BUCKET: "true"
      LINEA_STORE_OBJECTS_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      LINEA_STORE_OBJECTS_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      LINEA_WORKER_TOKEN_FILE: /run/secrets/worker_token
      LINEA_BUILDS_TOKEN_FILE: /run/secrets/builder_token
      # Sign-in: the built-in admin account, on unless .env sets this
      # variable empty, and an identity provider, on when .env names its
      # issuer.
      LINEA_AUTHENTICATION_ADMIN_PASSWORD_FILE: ${LINEA_AUTHENTICATION_ADMIN_PASSWORD_FILE-/run/secrets/admin_password}
      LINEA_AUTHENTICATION_OIDC_CLIENT_SECRET_FILE: ${LINEA_AUTHENTICATION_OIDC_ISSUER:+/run/secrets/oidc_client_secret}
      LINEA_AUTHENTICATION_OIDC_ISSUER: ${LINEA_AUTHENTICATION_OIDC_ISSUER:-}
      LINEA_AUTHENTICATION_OIDC_CLIENT_ID: ${LINEA_AUTHENTICATION_OIDC_CLIENT_ID:-}
      LINEA_AUTHENTICATION_OIDC_REDIRECT_URL: ${LINEA_AUTHENTICATION_OIDC_REDIRECT_URL:-}
      LINEA_AUTHENTICATION_OIDC_CLI_CLIENT_ID: ${LINEA_AUTHENTICATION_OIDC_CLI_CLIENT_ID:-}
      LINEA_AUTHENTICATION_OIDC_AUDIENCES: ${LINEA_AUTHENTICATION_OIDC_AUDIENCES:-}
      LINEA_AUTHENTICATION_OIDC_SCOPES: ${LINEA_AUTHENTICATION_OIDC_SCOPES:-}
      LINEA_AUTHENTICATION_OIDC_GROUPS_CLAIM: ${LINEA_AUTHENTICATION_OIDC_GROUPS_CLAIM:-}
      LINEA_AUTHENTICATION_OIDC_NAME_CLAIM: ${LINEA_AUTHENTICATION_OIDC_NAME_CLAIM:-}
      LINEA_AUTHENTICATION_OIDC_SESSION_TTL: ${LINEA_AUTHENTICATION_OIDC_SESSION_TTL:-}
      LINEA_AUTHENTICATION_TRUSTED_HEADERS_PROXIES: ${LINEA_AUTHENTICATION_TRUSTED_HEADERS_PROXIES:-}
      LINEA_AUTHENTICATION_TRUSTED_HEADERS_ISSUER: ${LINEA_AUTHENTICATION_TRUSTED_HEADERS_ISSUER:-}
      LINEA_AUTHENTICATION_TRUSTED_HEADERS_USER: ${LINEA_AUTHENTICATION_TRUSTED_HEADERS_USER:-}
      LINEA_AUTHENTICATION_TRUSTED_HEADERS_GROUPS: ${LINEA_AUTHENTICATION_TRUSTED_HEADERS_GROUPS:-}
      LINEA_AUTHENTICATION_TRUSTED_HEADERS_NAME: ${LINEA_AUTHENTICATION_TRUSTED_HEADERS_NAME:-}
      LINEA_BINDINGS: ${LINEA_BINDINGS:-}
      # Bounds and retention.
      LINEA_STORE_STORAGE_LIMIT: ${LINEA_STORE_STORAGE_LIMIT:-4GiB}
      LINEA_STORE_RUN_LIMIT: ${LINEA_STORE_RUN_LIMIT:-32MiB}
      LINEA_RETENTION_RUNS: ${LINEA_RETENTION_RUNS:-}
      LINEA_RETENTION_AGE: ${LINEA_RETENTION_AGE:-}
      LINEA_LIMITS_QUEUE: ${LINEA_LIMITS_QUEUE:-}
      LINEA_LIMITS_RUNS_PER_PRINCIPAL: ${LINEA_LIMITS_RUNS_PER_PRINCIPAL:-}
      LINEA_LIMITS_CAPTURES_PER_PRINCIPAL: ${LINEA_LIMITS_CAPTURES_PER_PRINCIPAL:-}
      LINEA_LIMITS_CONNECTIONS: ${LINEA_LIMITS_CONNECTIONS:-}
      LINEA_LIMITS_GIT_CLONE_SIZE: ${LINEA_LIMITS_GIT_CLONE_SIZE:-}
      LINEA_BUILDS_EXPORT_REPOSITORY: ${LINEA_BUILDS_EXPORT_REPOSITORY:-}
      # GOMAXPROCS follows the CPU limit by itself (Go 1.25 and later).
      GOMEMLIMIT: ${LINEA_SERVER_GOMEMLIMIT:-768MiB}
    secrets: [postgres_password, s3_access_key, s3_secret_key, worker_token, builder_token, admin_password, oidc_client_secret]
    ports:
      - "${LINEA_BIND:-127.0.0.1}:${LINEA_PORT:-7070}:7070"
    networks: [database, storage, edge, ingress]
    cpus: ${LINEA_SERVER_CPUS:-2}
    mem_limit: ${LINEA_SERVER_MEMORY:-1g}
    pids_limit: 256
    healthcheck:
      test: [CMD, /linea-server, probe]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # The pool worker. It runs the built-in runtime as its own executable, and
  # registers it, so requests that name no runtime run here. It also serves
  # any runtime the builder made for its platform, downloading each binary
  # through a presigned SeaweedFS URL into /cache. It runs one child process
  # per runtime in use, started on demand, LINEA_POOL_CAPACITY requests at
  # once across them. It reaches the server and SeaweedFS only. The hardened
  # /tmp is noexec and children run from the cache, so /cache, a named
  # volume, allows execution. Its memory and CPUs are shared by the children
  # it keeps warm (--warm, default 4, stops the least recently used idle
  # ones; --idle, default 10m; --cache, default 5GiB, bounds /cache).
  pool:
    <<: *hardened
    image: ghcr.io/lineahq/linea-worker:${LINEA_VERSION:-0.2.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-worker.Dockerfile
    command: [--connect, "http://linea:7070", --pool, --name, pool, --capacity, "${LINEA_POOL_CAPACITY:-4}", --cache-dir, /cache, --token-file, /run/secrets/worker_token]
    # No GOMAXPROCS or GOMEMLIMIT: the children inherit the environment, and
    # the container limits below are the bound.
    secrets: [worker_token]
    volumes:
      - pool-cache:/cache
    networks: [edge, storage]
    cpus: ${LINEA_POOL_CPUS:-4}
    mem_limit: ${LINEA_POOL_MEMORY:-4g}
    pids_limit: 512
    depends_on:
      linea:
        condition: service_healthy

  # Builds runtimes for the server and nothing else. It dials the server like
  # a worker, with its own token, reads the manifest and uploaded sources and
  # writes the binary through presigned SeaweedFS URLs, and holds no database
  # or bucket credentials. It is the only service on the egress network,
  # which reaches the module proxy. Builds run compilers and start the
  # binaries they make, so /work, a named volume holding its module and
  # build caches, allows execution (it is not the noexec /tmp).
  # LINEA_BUILDER_MEMORY and LINEA_BUILDER_CPUS are the build budget; one
  # build runs at a time. To export images (LINEA_BUILDS_EXPORT_REPOSITORY),
  # mount a Docker config.json with the registry's credentials and pass
  # --registry-auth with its path; egress must reach the registry.
  builder:
    <<: *hardened
    image: ghcr.io/lineahq/linea-builder:${LINEA_VERSION:-0.2.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-builder.Dockerfile
    user: "65532:65532"
    command: [--connect, "http://linea:7070", --name, builder, --capacity, "1", --cpus, "${LINEA_BUILDER_CPUS:-4}", --token-file, /run/secrets/builder_token, --work-dir, /work]
    secrets: [builder_token]
    volumes:
      - builder-work:/work
    networks: [edge, storage, egress]
    cpus: ${LINEA_BUILDER_CPUS:-4}
    mem_limit: ${LINEA_BUILDER_MEMORY:-5g}
    memswap_limit: ${LINEA_BUILDER_MEMORY:-5g}
    pids_limit: 1024
    depends_on:
      linea:
        condition: service_healthy

# One file each in secrets/, mounted read-only under /run/secrets in only
# the services that list it. Create them all before the first start, with
# random values (openssl rand -hex 32 > secrets/<name>); oidc_client_secret
# holds your identity provider's client secret and stays empty without one.
# Services read them when they start. PostgreSQL takes postgres_password
# once, when its volume is created, so keep it as long as the data. Docker
# makes a directory in place of a missing file, and the service that reads
# it stops with an error naming it.
secrets:
  postgres_password:
    file: ${LINEA_SECRETS_DIR:-./secrets}/postgres_password
  s3_access_key:
    file: ${LINEA_SECRETS_DIR:-./secrets}/s3_access_key
  s3_secret_key:
    file: ${LINEA_SECRETS_DIR:-./secrets}/s3_secret_key
  worker_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/worker_token
  builder_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/builder_token
  admin_password:
    file: ${LINEA_SECRETS_DIR:-./secrets}/admin_password
  oidc_client_secret:
    file: ${LINEA_SECRETS_DIR:-./secrets}/oidc_client_secret

volumes:
  postgres-data:
  seaweedfs-data:
  # The builder's module cache, build cache and build directories. Mounted
  # executable: builds start the programs they compile.
  builder-work:
  # The pool worker's runtime binaries, bounded by its --cache. Mounted
  # executable: its children run from here.
  pool-cache:

networks:
  database:
    internal: true
  storage:
    internal: true
  # The server, the pool worker, the builder and any worker added beside them.
  edge:
    internal: true
  # The server's published port.
  ingress:
  # The builder's way out, to the module proxy (and git hosts a manifest
  # names): the only route out of the stack besides the server's published
  # port. The server and workers have none. Compose cannot limit it to
  # chosen hosts; a host firewall can, and the chart's builder NetworkPolicy
  # does on Kubernetes.
  egress:
