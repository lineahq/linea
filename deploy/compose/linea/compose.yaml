# The debugger's team server on one machine: two linea-server instances
# behind a load balancer, PostgreSQL, SeaweedFS, a pool worker that runs the
# built-in runtime and every runtime the server builds, and a runtime builder.
# Nothing is registered by hand. See docs/debugger/deploy-compose.md.
#
# This file is all you need. Put it in a directory with a .env file that
# holds five random values, then run docker compose up -d there:
#
#   LINEA_POSTGRES_PASSWORD, LINEA_S3_ACCESS_KEY, LINEA_S3_SECRET_KEY,
#   LINEA_WORKER_TOKEN, LINEA_BUILDER_TOKEN
#
# Each needs at least 16 letters, digits or . _ ~ - (openssl rand -hex 32
# makes one); the two tokens must differ. Keep .env as long as the volumes:
# PostgreSQL takes its password when its volume is created.
#
# Optional settings, in the same .env or the shell:
#   LINEA_VERSION (this file's release), LINEA_PORT (7070)
#   Resources, which are limits, not reservations; a CPU limit above the
#   host's CPU count makes Docker refuse the container:
#   LINEA_REPLICAS (2), LINEA_SERVER_CPUS (2), LINEA_SERVER_MEMORY (1g),
#   LINEA_SERVER_GOMEMLIMIT (768MiB, below LINEA_SERVER_MEMORY)
#   LINEA_POOL_CAPACITY (4), LINEA_POOL_CPUS (4), LINEA_POOL_MEMORY (4g)
#   LINEA_BUILDER_CPUS (4, a whole number), LINEA_BUILDER_MEMORY (5g)
#
# Needs Docker Engine 26 or later with Compose v2.30 or later (volume
# subpaths).
name: linea

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  # One-shot: writes each service's secrets and configuration into its own
  # folder of the setup volume, from .env and the configs below, and checks
  # the .env values first. It runs again on every up; recreate the stack
  # (up -d --force-recreate) after editing a config. It is the only service
  # that sees every secret; the others mount only their own folder,
  # read-only. It has no network.
  setup:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        for name in postgres_password s3_access_key s3_secret_key worker_token builder_token; do
          value=$$(cat "/run/secrets/$$name")
          var=LINEA_$$(echo "$$name" | tr a-z A-Z)
          case $$value in
            *[!A-Za-z0-9._~-]*) echo "$$var in .env: use only letters, digits and . _ ~ - (openssl rand -hex 32)" >&2; exit 1 ;;
          esac
          if [ $${#value} -lt 16 ]; then echo "$$var in .env: set it to at least 16 characters (openssl rand -hex 32)" >&2; exit 1; fi
        done
        if cmp -s /run/secrets/worker_token /run/secrets/builder_token; then
          echo 'LINEA_WORKER_TOKEN and LINEA_BUILDER_TOKEN in .env must differ' >&2; exit 1
        fi
        umask 022
        mkdir -p /setup/postgres /setup/seaweedfs /setup/linea /setup/proxy /setup/pool /setup/builder
        cp /run/secrets/postgres_password /setup/postgres/
        printf '{"identities":[{"name":"linea","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$(cat /run/secrets/s3_access_key)" "$$(cat /run/secrets/s3_secret_key)" > /setup/seaweedfs/s3_config
        printf 'postgres://linea:%s@postgres:5432/linea?sslmode=disable' "$$(cat /run/secrets/postgres_password)" > /setup/linea/database_url
        cp /run/secrets/s3_access_key /run/secrets/s3_secret_key /run/secrets/worker_token /run/secrets/builder_token /run/configs/config.yaml /setup/linea/
        cp /run/configs/haproxy.cfg /setup/proxy/
        cp /run/secrets/worker_token /setup/pool/
        cp /run/secrets/builder_token /setup/builder/
    secrets: [postgres_password, s3_access_key, s3_secret_key, worker_token, builder_token]
    configs:
      - source: server_config
        target: /run/configs/config.yaml
      - source: haproxy_config
        target: /run/configs/haproxy.cfg
    volumes:
      - setup:/setup
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  postgres:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: linea
      POSTGRES_USER: linea
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: volume
        source: setup
        target: /run/secrets
        read_only: true
        volume: {subpath: postgres}
    networks: [database]
    depends_on:
      setup:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U linea -d linea"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      options:
        max-size: 10m
        max-file: "3"

  seaweedfs:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    entrypoint: [weed]
    command: [server, -dir=/data, -master.volumeSizeLimitMB=64, -volume.max=30, -filer, -s3, -s3.port=8333, -s3.config=/run/secrets/s3_config]
    volumes:
      - seaweedfs-data:/data
      - type: volume
        source: setup
        target: /run/secrets
        read_only: true
        volume: {subpath: seaweedfs}
    networks: [storage]
    depends_on:
      setup:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # Creates the bucket once the gateway answers; an existing bucket is kept.
  bucket:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    entrypoint: [sh, -c]
    command:
      - |
        for i in $$(seq 60); do
          if echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw linea; then exit 0; fi
          echo 's3.bucket.create -name linea' | weed shell -master=seaweedfs:9333 >/dev/null 2>&1
          sleep 1
        done
        echo 'the bucket linea could not be created' >&2
        exit 1
    networks: [storage]
    depends_on: [seaweedfs]
    restart: "no"

  # The instances. Each drains on SIGTERM (--drain-timeout) and hands back
  # what it still runs; stop_grace_period leaves room for that.
  linea:
    <<: *hardened
    image: ghcr.io/lineahq/linea-server:${LINEA_VERSION:-0.1.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-server.Dockerfile
    user: "65532:65532"
    command: [--config, /run/secrets/config.yaml, --addr, "0.0.0.0:7070", --allow-http, --mcp, --drain-timeout, 25s]
    deploy:
      replicas: ${LINEA_REPLICAS:-2}
    stop_grace_period: 45s
    # GOMAXPROCS follows the CPU limit by itself (Go 1.25 and later).
    environment:
      GOMEMLIMIT: ${LINEA_SERVER_GOMEMLIMIT:-768MiB}
    volumes:
      - type: volume
        source: setup
        target: /run/secrets
        read_only: true
        volume: {subpath: linea}
    networks: [database, storage, edge]
    cpus: ${LINEA_SERVER_CPUS:-2}
    mem_limit: ${LINEA_SERVER_MEMORY:-1g}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
      setup:
        condition: service_completed_successfully

  # The only way in: 127.0.0.1:7070 on the host.
  proxy:
    image: haproxy:3.2-alpine@sha256:5893840576071e6217cd52ebdcc14f454c6f7a631056fa6f4e0f40d3cac4215b
    <<: *hardened
    user: haproxy
    volumes:
      - type: volume
        source: setup
        target: /usr/local/etc/haproxy
        read_only: true
        volume: {subpath: proxy}
    ports:
      - "127.0.0.1:${LINEA_PORT:-7070}:7070"
    networks:
      edge:
        ipv4_address: 10.207.70.10 # the server config's trusted proxy
      ingress: {}
    cpus: 1 # keep equal to nbthread in haproxy_config below
    mem_limit: 128m
    pids_limit: 64
    depends_on: [linea]

  # The pool worker. It runs the built-in
  # runtime as its own executable, and registers it, so requests that name
  # no runtime run here. It also serves any runtime the builder made for its
  # platform, downloading each binary through a presigned SeaweedFS URL into
  # /cache. It runs one child process per runtime in use, started on demand,
  # LINEA_POOL_CAPACITY requests at once across them. It reaches the load
  # balancer and SeaweedFS only. The hardened /tmp is noexec and children run
  # from the cache, so /cache, a named volume, allows execution. Its memory
  # and CPUs are shared by the children it keeps warm (--warm, default 4,
  # stops the least recently used idle ones; --idle, default 10m; --cache,
  # default 5GiB, bounds /cache).
  pool:
    <<: *hardened
    image: ghcr.io/lineahq/linea-worker:${LINEA_VERSION:-0.1.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-worker.Dockerfile
    command: [--connect, "http://proxy:7070", --pool, --name, pool, --capacity, "${LINEA_POOL_CAPACITY:-4}", --cache-dir, /cache, --token-file, /run/secrets/worker_token]
    # No GOMAXPROCS or GOMEMLIMIT: the children inherit the environment, and
    # the container limits below are the bound.
    volumes:
      - pool-cache:/cache
      - type: volume
        source: setup
        target: /run/secrets
        read_only: true
        volume: {subpath: pool}
    networks: [edge, storage]
    cpus: ${LINEA_POOL_CPUS:-4}
    mem_limit: ${LINEA_POOL_MEMORY:-4g}
    pids_limit: 512
    depends_on: [proxy]

  # Builds runtimes for the team server and nothing else. It
  # dials the load balancer like a worker, with its own token, reads the
  # manifest and uploaded sources and writes the binary through presigned
  # SeaweedFS URLs, and holds no database or bucket credentials. It is the
  # only service on the egress network, which reaches the module proxy.
  # Builds run compilers and start the binaries they make, so /work, a named
  # volume holding its module and build caches, allows execution (it is not
  # the noexec /tmp). LINEA_BUILDER_MEMORY and LINEA_BUILDER_CPUS are the
  # build budget; one build runs at a time. To export images (the server
  # config's builds.export), mount a Docker config.json with the registry's
  # credentials and pass --registry-auth with its path; egress must reach
  # the registry.
  builder:
    <<: *hardened
    image: ghcr.io/lineahq/linea-builder:${LINEA_VERSION:-0.1.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-builder.Dockerfile
    user: "65532:65532"
    command: [--connect, "http://proxy:7070", --name, builder, --capacity, "1", --cpus, "${LINEA_BUILDER_CPUS:-4}", --token-file, /run/secrets/builder_token, --work-dir, /work]
    volumes:
      - builder-work:/work
      - type: volume
        source: setup
        target: /run/secrets
        read_only: true
        volume: {subpath: builder}
    networks: [edge, storage, egress]
    cpus: ${LINEA_BUILDER_CPUS:-4}
    mem_limit: ${LINEA_BUILDER_MEMORY:-5g}
    memswap_limit: ${LINEA_BUILDER_MEMORY:-5g}
    pids_limit: 1024
    depends_on: [proxy]

# The values from .env. Only the setup service reads them.
secrets:
  postgres_password:
    environment: LINEA_POSTGRES_PASSWORD
  s3_access_key:
    environment: LINEA_S3_ACCESS_KEY
  s3_secret_key:
    environment: LINEA_S3_SECRET_KEY
  worker_token:
    environment: LINEA_WORKER_TOKEN
  builder_token:
    environment: LINEA_BUILDER_TOKEN

# Edit these here; setup writes them for the services.
configs:
  server_config:
    content: |
      # The server config. The setup service writes it, with the secrets it
      # names, to each instance's /run/secrets.
      version: 1
      store:
        database_url_file: /run/secrets/database_url
        objects:
          endpoint: http://seaweedfs:8333
          bucket: linea
          path_style: true
          access_key_file: /run/secrets/s3_access_key
          secret_key_file: /run/secrets/s3_secret_key
        # Runtime binaries (about 85 MiB each for the default manifest) count
        # toward the limit.
        storage_limit: 4GiB
        run_limit: 32MiB
      worker_token_file: /run/secrets/worker_token
      # The builder service dials with this token and compiles the
      # runtimes that web, CLI and MCP builds ask for. It differs from
      # the workers' token.
      builds:
        token_file: /run/secrets/builder_token
        # Optional: the builder also pushes each built runtime's image here,
        # tagged with the build's name. Give the builder the registry's
        # credentials (the builder service).
        # export:
        #   repository: registry.example.com/team/linea-runtimes
      authentication:
        # The load balancer signs every browser and CLI request in as one local
        # user. It is the only trusted proxy: its fixed address on the edge network,
        # which no published port reaches directly.
        trusted_headers:
          proxies: [10.207.70.10]
          issuer: linea-compose
          user: X-Linea-User
          groups: X-Linea-Groups
      bindings:
        - group: local-admins
          role: admin
          scope: "*"
  haproxy_config:
    content: |
      # The load balancer in front of the debugger instances. Any
      # instance serves any request, so there is no affinity.
      #
      # - It signs every request in as the stack's one local user: it drops the
      #   identity headers a client sent and sets its own. The server config trusts
      #   these headers from this proxy's address only.
      # - Workers dial through it too: their WebSocket (/v1/workers/connect) is a
      #   tunnel, kept open past the server's 30 s pings.
      # - Docker DNS resolves the scaled "linea" service to every instance; up to
      #   four instances fill the server template. An instance that drains stops
      #   accepting connections and leaves the rotation on its failed check.
      global
          maxconn 4096
          # Match the proxy service's CPU limit ("cpus").
          nbthread 1

      defaults
          mode http
          timeout connect 5s
          # Report waits (?wait=true) are long polls that last as long as a run.
          # The CLI sends a wait again when it times out or its instance stops.
          timeout client 10m
          timeout server 10m
          timeout tunnel 120s
          timeout check 2s
          retries 2
          option redispatch 1

      resolvers docker
          nameserver dns 127.0.0.11:53
          hold valid 5s

      frontend debugger
          bind :7070
          # Only loopback names and the workers' "proxy" reach the signed-in user:
          # a page whose own name was rebound to 127.0.0.1 is refused.
          acl allowed_host req.hdr(host) -m reg -i ^(127\.0\.0\.1|localhost|proxy)(:[0-9]+)?$$
          http-request deny deny_status 421 unless allowed_host
          http-request del-header X-Linea-User
          http-request del-header X-Linea-Groups
          http-request set-header X-Linea-User local
          http-request set-header X-Linea-Groups local-admins
          default_backend linea

      backend linea
          balance roundrobin
          default-server check inter 2s fall 2 rise 2 resolvers docker init-addr none
          server-template linea 4 linea:7070

volumes:
  # Each service's secrets and configuration, written by setup.
  setup:
  postgres-data:
  seaweedfs-data:
  # The builder's module cache, build cache and build directories. Mounted
  # executable: builds start the programs they compile.
  builder-work:
  # The pool worker's runtime binaries, bounded by its --cache. Mounted
  # executable: its children run from here.
  pool-cache:

networks:
  database:
    internal: true
  storage:
    internal: true
  # Instances, workers and the load balancer. Internal: only the load
  # balancer's published port reaches it from the host.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 10.207.70.0/24
  ingress:
  # The builder's way out, to the module proxy (and git hosts a manifest
  # names): the only route out of the stack besides the load balancer's
  # published port. Instances and workers have none. Compose cannot limit it
  # to chosen hosts; a host firewall can, and the chart's builder
  # NetworkPolicy does on Kubernetes.
  egress:
