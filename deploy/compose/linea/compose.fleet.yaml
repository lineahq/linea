# Fleet and the live-capture plugin beside the debugger, on the debugger's
# PostgreSQL: one server, three databases (linea, fleet, livecapture), each
# with its own roles. linea-server is connected to fleet, so the web client's
# live capture works. See docs/debugger/deploy-compose.md#fleet-and-live-capture.
#
# Its secrets are more files in the stack's secrets/ directory, created
# before the first start (scripts/debugger/compose-fleet.sh names a missing
# one). The database URLs carry the roles' passwords, which fleet-db sets, so
# use hex passwords (openssl rand -hex 32), with nothing that needs URL
# escaping:
#   fleet_database_url            postgres://fleet_app:<pw>@postgres:5432/fleet?sslmode=disable
#   fleet_migrate_database_url    postgres://fleet_migrator:<pw>@postgres:5432/fleet?sslmode=disable
#   capture_database_url          postgres://capture_app:<pw>@postgres:5432/livecapture?sslmode=disable
#   capture_migrate_database_url  postgres://capture_migrator:<pw>@postgres:5432/livecapture?sslmode=disable
#   fleet_admin_token             the fleet admin token, which fleet-bootstrap
#       installs as the first fleet admin. It stays with you, for issuing
#       fleet credentials and plugin operations; linea-server never gets it:
#       printf 'of1_%s_%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > secrets/fleet_admin_token
#   fleet_operator_token          linea-server's fleet credential, which
#       fleet-bootstrap installs as a fleet operator (admin without the
#       credentials API and plugin lifecycle operations); a different token:
#       printf 'of1_%s_%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > secrets/fleet_operator_token
#   capture_host_token, capture_service_token, capture_metrics_token
#                                 the plugin's tokens (openssl rand -hex 32)
#   capture_tls.crt, capture_tls.key
#       the plugin's certificate and key for its control and delivery
#       endpoints; Collectors trust the certificate as their CA. The key must
#       be readable by uid 65532, hence chmod 644:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj /CN=livecapture-plugin \
#     -keyout secrets/capture_tls.key -out secrets/capture_tls.crt \
#     -addext 'subjectAltName=DNS:livecapture-plugin,DNS:localhost,IP:127.0.0.1' \
#     -addext 'basicConstraints=critical,CA:TRUE' && chmod 644 secrets/capture_tls.key
#
# The plugin's settings are livecapture.json beside this file, and fleet's
# plugin list fleet-plugins.json. To let captures include raw points, add
# credential IDs to raw_principals in livecapture.json; linea-server's is the
# second _-separated field of fleet_operator_token. LINEA_CAPTURE_CONFIG names
# another copy of it, kept out of the files an upgrade replaces.
#
# Initialize once, and again after an upgrade (migrations stay explicit):
#   scripts/debugger/compose-fleet.sh            (from the repository root)
# It creates the databases and roles, migrates both schemas, installs the
# admin token as the first fleet admin and the operator token as linea-server's
# fleet operator, and starts the stack. After changing
# a secret file, run it again, then restart the services that read it.
#
# Optional settings, in .env:
#   LINEA_FLEET_SERVER_ID (linea-fleet), LINEA_FLEET_PORT (8080, management
#   API), LINEA_FLEET_AGENT_PORT (4320, OpAMP), LINEA_CAPTURE_CONTROL_PORT
#   (4340), LINEA_CAPTURE_DELIVERY_PORT (4341), all on LINEA_FLEET_BIND
#   (127.0.0.1). Fleet serves plain HTTP and OpAMP over ws://; put TLS in
#   front before binding them beyond loopback. LINEA_FLEET_CONFIG_MANAGEMENT
#   (false) turns on config management.
# To keep fleet on its own PostgreSQL instead, use deploy/compose/fleet.

x-fleet-hardened: &fleet-hardened
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "65532:65532"
  logging:
    options:
      max-size: 10m
      max-file: "3"

x-postgres-tool: &postgres-tool
  image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
  entrypoint: [sh, -c]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"

services:
  # One-shot on every up: creates or updates the fleet and livecapture
  # databases and roles in the debugger's PostgreSQL, as linea. Idempotent.
  # Each role's password is the one in its URL.
  fleet-db:
    <<: *postgres-tool
    command:
      - |
        set -eu
        export PGHOST=postgres PGUSER=linea PGDATABASE=linea
        PGPASSWORD=$$(cat /run/secrets/postgres_password); export PGPASSWORD
        # password <secret> <role> <database>: the password in the URL.
        password() {
          url=$$(cat "/run/secrets/$$1")
          case "$$url" in
            "postgres://$$2:"?*"@postgres:5432/$$3?"*) ;;
            *) echo "$$1 must be postgres://$$2:<password>@postgres:5432/$$3?sslmode=disable" >&2; exit 1 ;;
          esac
          url=$${url#*://*:}
          printf '%s' "$${url%%@*}"
        }
        FLEET_MIGRATE_PASSWORD=$$(password fleet_migrate_database_url fleet_migrator fleet)
        FLEET_RUNTIME_PASSWORD=$$(password fleet_database_url fleet_app fleet)
        CAPTURE_MIGRATE_PASSWORD=$$(password capture_migrate_database_url capture_migrator livecapture)
        CAPTURE_RUNTIME_PASSWORD=$$(password capture_database_url capture_app livecapture)
        export FLEET_MIGRATE_PASSWORD FLEET_RUNTIME_PASSWORD CAPTURE_MIGRATE_PASSWORD CAPTURE_RUNTIME_PASSWORD
        psql --quiet --set ON_ERROR_STOP=1 <<'SQL'
        \getenv fm FLEET_MIGRATE_PASSWORD
        \getenv fr FLEET_RUNTIME_PASSWORD
        \getenv cm CAPTURE_MIGRATE_PASSWORD
        \getenv cr CAPTURE_RUNTIME_PASSWORD
        SELECT format('CREATE ROLE %I', r) FROM unnest(ARRAY['fleet_migrator','fleet_app','capture_migrator','capture_app']) r
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = r) \gexec
        ALTER ROLE fleet_migrator LOGIN NOCREATEDB NOCREATEROLE PASSWORD :'fm';
        ALTER ROLE fleet_app LOGIN NOCREATEDB NOCREATEROLE PASSWORD :'fr';
        ALTER ROLE capture_migrator LOGIN NOCREATEDB NOCREATEROLE PASSWORD :'cm';
        ALTER ROLE capture_app LOGIN NOCREATEDB NOCREATEROLE PASSWORD :'cr';
        SELECT format('CREATE DATABASE %I', d) FROM unnest(ARRAY['fleet','livecapture']) d
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = d) \gexec
        -- Each role reaches its own database only.
        REVOKE ALL ON DATABASE linea, fleet, livecapture FROM PUBLIC;
        GRANT CONNECT, CREATE ON DATABASE fleet TO fleet_migrator;
        GRANT CONNECT ON DATABASE fleet TO fleet_app;
        GRANT CONNECT, CREATE ON DATABASE livecapture TO capture_migrator;
        GRANT CONNECT ON DATABASE livecapture TO capture_app;
        \connect fleet
        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        \connect livecapture
        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        SQL
        echo 'fleet and livecapture databases are ready'
    secrets: [postgres_password, fleet_database_url, fleet_migrate_database_url, capture_database_url, capture_migrate_database_url]
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  fleet:
    <<: *fleet-hardened
    image: ghcr.io/lineahq/linea-fleet:${LINEA_VERSION:-0.2.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-fleet.Dockerfile
    command: [--server-id, "${LINEA_FLEET_SERVER_ID:-linea-fleet}", --management-listen, "0.0.0.0:8080", --agent-listen, "0.0.0.0:4320", --allow-insecure-remote, --plugins-config, /etc/linea/plugins.json, --plugin-listen, "0.0.0.0:8081", "--config-management=${LINEA_FLEET_CONFIG_MANAGEMENT:-false}"]
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 768MiB
      LINEA_FLEET_DATABASE_URL_FILE: /run/secrets/fleet_database_url
    secrets: [fleet_database_url, capture_host_token, capture_service_token]
    configs:
      - {source: fleet_plugins, target: /etc/linea/plugins.json}
    ports:
      - "${LINEA_FLEET_BIND:-127.0.0.1}:${LINEA_FLEET_PORT:-8080}:8080"
      - "${LINEA_FLEET_BIND:-127.0.0.1}:${LINEA_FLEET_AGENT_PORT:-4320}:4320"
    networks: [database, fleet, fleet-agents, fleet-plugins]
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      fleet-db:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /linea-fleet, probe]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  livecapture-plugin:
    <<: *fleet-hardened
    image: ghcr.io/lineahq/linea-fleet-livecapture:${LINEA_VERSION:-0.2.0}
    build:
      context: ../../..
      dockerfile: deploy/docker/linea-fleet-livecapture.Dockerfile
      target: plugin
    command: [serve, --config, /etc/linea/livecapture.json]
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 384MiB
      LINEA_FLEET_CAPTURE_DATABASE_URL_FILE: /run/secrets/capture_database_url
    secrets: [capture_database_url, capture_host_token, capture_service_token, capture_metrics_token, capture_tls_cert, capture_tls_key]
    configs:
      - {source: livecapture_config, target: /etc/linea/livecapture.json}
    ports:
      - "${LINEA_FLEET_BIND:-127.0.0.1}:${LINEA_CAPTURE_CONTROL_PORT:-4340}:4340"
      - "${LINEA_FLEET_BIND:-127.0.0.1}:${LINEA_CAPTURE_DELIVERY_PORT:-4341}:4341"
    networks: [database, fleet-plugins, capture-ingress]
    cpus: 2
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      fleet:
        condition: service_healthy
    healthcheck:
      test: [CMD, /plugin, probe, --config, /etc/linea/livecapture.json]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The base stack's flags, plus the fleet connection.
  linea:
    command: [--addr, "0.0.0.0:7070", --allow-http, --mcp, --drain-timeout, 25s, --fleet-url, "http://fleet:8080", --fleet-allow-http, --fleet-token-file, /run/secrets/fleet_operator_token]
    secrets: [fleet_operator_token]
    networks: [fleet]
    depends_on:
      fleet:
        condition: service_healthy

  # Explicit steps, run by scripts/debugger/compose-fleet.sh (profile fleet-init).
  fleet-migrate:
    <<: *fleet-hardened
    image: ghcr.io/lineahq/linea-fleet:${LINEA_VERSION:-0.2.0}
    profiles: [fleet-init]
    command: [migrate, --runtime-role, fleet_app]
    environment:
      LINEA_FLEET_DATABASE_URL_FILE: /run/secrets/fleet_migrate_database_url
    secrets: [fleet_migrate_database_url]
    networks: [database]
    restart: "no"
  capture-migrate:
    <<: *fleet-hardened
    image: ghcr.io/lineahq/linea-fleet-livecapture:${LINEA_VERSION:-0.2.0}
    profiles: [fleet-init]
    command: [migrate, --runtime-role, capture_app]
    environment:
      LINEA_FLEET_CAPTURE_DATABASE_URL_FILE: /run/secrets/capture_migrate_database_url
    secrets: [capture_migrate_database_url]
    networks: [database]
    restart: "no"
  # Installs the admin token as the first fleet admin and linea-server's
  # token as a fleet operator; repeating it changes nothing while they are
  # active.
  fleet-bootstrap:
    <<: *fleet-hardened
    image: ghcr.io/lineahq/linea-fleet:${LINEA_VERSION:-0.2.0}
    profiles: [fleet-init]
    command: [bootstrap, --server-id, "${LINEA_FLEET_SERVER_ID:-linea-fleet}", --name, deployment-admin, --operator-name, linea-server]
    environment:
      LINEA_FLEET_DATABASE_URL_FILE: /run/secrets/fleet_database_url
      LINEA_FLEET_BOOTSTRAP_TOKEN_FILE: /run/secrets/fleet_admin_token
      LINEA_FLEET_OPERATOR_TOKEN_FILE: /run/secrets/fleet_operator_token
    secrets: [fleet_database_url, fleet_admin_token, fleet_operator_token]
    networks: [database]
    restart: "no"

# One file each in the stack's secrets/ directory, mounted only in the
# services that list it.
secrets:
  fleet_database_url:
    file: ${LINEA_SECRETS_DIR:-./secrets}/fleet_database_url
  fleet_migrate_database_url:
    file: ${LINEA_SECRETS_DIR:-./secrets}/fleet_migrate_database_url
  capture_database_url:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_database_url
  capture_migrate_database_url:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_migrate_database_url
  fleet_admin_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/fleet_admin_token
  fleet_operator_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/fleet_operator_token
  capture_host_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_host_token
  capture_service_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_service_token
  capture_metrics_token:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_metrics_token
  capture_tls_cert:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_tls.crt
  capture_tls_key:
    file: ${LINEA_SECRETS_DIR:-./secrets}/capture_tls.key

configs:
  livecapture_config:
    file: ${LINEA_CAPTURE_CONFIG:-./livecapture.json}
  fleet_plugins:
    file: ./fleet-plugins.json

networks:
  # linea-server to the fleet management API.
  fleet:
    internal: true
  # Fleet to its plugin (host and service APIs).
  fleet-plugins:
    internal: true
  # OpAMP from Collectors (published LINEA_FLEET_AGENT_PORT).
  fleet-agents:
  # Collectors' control streams and deliveries to the plugin.
  capture-ingress:
