# Plain TCP load balancer for compose.ha.yaml. Any replica
# can serve any agent or API request, so there is no owner routing.
#
# - Agents use leastconn, so reconnecting agents spread over the remaining
#   replicas. Unready replicas (draining, or briefly without a database) get
#   no new sessions, but their existing sessions are kept: a replica closes its
#   own sockets when it drains or fences itself.
# - Idle timeouts exceed the agent heartbeat (30 s) and the 30 s event
#   long-poll. A replica that stops answering loses its sessions after 90 s.
# - Docker DNS resolves the scaled "fleet" service to every replica; up to
#   eight replicas fill the server templates.
global
    maxconn 50000
    # Match the container CPU limit (compose.ha.yaml "cpus"). HAProxy sizes
    # its threads from the host's CPUs, not the cgroup quota: under "cpus: 1"
    # on a 16-CPU host it would start 16 threads that contend for one CPU.
    nbthread 1

defaults
    mode tcp
    timeout connect 5s
    timeout client 90s
    timeout server 90s
    timeout check 2s
    # A failed connect to a replica that just died is retried on another.
    retries 2
    option redispatch 1

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend agents
    bind :4320
    maxconn 45000
    default_backend fleet_agents

frontend management
    bind :8080
    maxconn 1000
    default_backend fleet_management

backend fleet_agents
    balance leastconn
    option httpchk GET /readyz
    default-server check port 8080 inter 1s fall 2 rise 2 observe layer4 error-limit 1 on-error mark-down resolvers docker resolve-prefer ipv4 init-addr none
    server-template fleet 8 fleet:4320

backend fleet_management
    balance roundrobin
    option httpchk GET /readyz
    default-server check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
    server-template fleet 8 fleet:8080
