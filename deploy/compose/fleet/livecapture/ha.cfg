global
    maxconn 600
    nbthread 2
defaults
    mode tcp
    retries 0
    timeout connect 1s
    timeout check 1s
    timeout client 10m
    timeout server 10m
    default-server inter 500ms fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none on-marked-down shutdown-sessions
resolvers docker
    nameserver dns 127.0.0.11:53
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
listen probe
    bind :8404
    mode http
    http-request return status 200 content-type application/json string '{"status":"live"}'
listen api
    bind :8090
    option httpchk GET /activez
    http-check expect status 200
    server a capture-a:8090 check port 8091
    server b capture-b:8090 check port 8091
listen control
    bind :4340
    option httpchk GET /activez
    http-check expect status 200
    server a capture-a:4340 check port 8091
    server b capture-b:4340 check port 8091
listen delivery
    bind :4341
    option httpchk GET /activez
    http-check expect status 200
    server a capture-a:4341 check port 8091
    server b capture-b:4341 check port 8091
