# Synthetic data only: detailed debug output includes telemetry payloads.
extensions:
  livecapture:
    enabled: false
    environment: development
    collector_group: development
    pod: local
    cluster: local
    delivery:
      endpoint: 127.0.0.1:14317
      tls:
        insecure: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTLP_GRPC_ENDPOINT:-127.0.0.1:4317}
      http:
        endpoint: ${env:OTLP_HTTP_ENDPOINT:-127.0.0.1:4318}

processors:
  capture/ingress:
    sensitivity: raw
  capture/egress:
    sensitivity: redacted
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 100ms
    send_batch_size: 128

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [livecapture]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, capture/ingress, capture/egress, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, capture/ingress, capture/egress, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, capture/ingress, capture/egress, batch]
      exporters: [debug]
