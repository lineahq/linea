# Logs are exported and also counted: the count connector turns them into
# metrics on a second pipeline. Debug logs are dropped before either.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  filter/debug:
    error_mode: ignore
    logs:
      log_record:
        - severity_number < SEVERITY_NUMBER_INFO
  resource/metrics:
    attributes:
      - key: telemetry.source
        value: log-counts
        action: insert

connectors:
  count:
    logs:
      app.log.errors:
        description: Error logs per service and route.
        conditions:
          - log.severity_number >= SEVERITY_NUMBER_ERROR
        attributes:
          - key: service.name
          - key: http.route
            default_value: unknown
      app.log.records:
        description: Log records per service.
        attributes:
          - key: service.name

exporters:
  otlp/logs:
    endpoint: logs.example.invalid:4317
  otlp/metrics:
    endpoint: metrics.example.invalid:4317

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [filter/debug]
      exporters: [otlp/logs, count]
    metrics/counts:
      receivers: [count]
      processors: [resource/metrics]
      exporters: [otlp/metrics]
