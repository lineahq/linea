# What the debugger leaves out of the 0.165.0 release manifest (manifest.yaml,
# upstream's otelcol-contrib manifest, unchanged). Verified by building it
# (docs/internals/runtime-builds.md). The catalog lists every component, with
# the reason for these.
#
# asapauthextension is no longer listed: upstream's 0.165.0 manifest
# comments it out (contrib #51868), so it is not part of the release.
#
# excluded: not in the dependency set; a build naming one resolves it
# through the user's module source as a custom module.
excluded:
  go.opentelemetry.io/obi/collector: >-
    the OBI receiver builds only from a source tree upstream's release script
    prepares (a local replace)
# replaces: release manifest replaces the dependency set is resolved without.
replaces:
  go.opentelemetry.io/obi: a local source tree for the OBI receiver
# types: component types of modules without a metadata.yaml.
types:
  go.opentelemetry.io/obi/collector: obi
